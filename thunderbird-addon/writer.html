<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Writer</title>
<link rel="stylesheet" href="shared/ui.css">
<link rel="stylesheet" href="vendor/katex.css">
<link rel="stylesheet" href="vendor/writer/prosemirror.css">
<link rel="stylesheet" href="vendor/writer/tables.css">
<link rel="stylesheet" href="vendor/writer/gapcursor.css">
<link rel="stylesheet" href="shared/doctabs.css">
<link rel="stylesheet" href="shared/editor.css">
<link rel="stylesheet" href="shared/home.css">
<link rel="stylesheet" href="writer.css">
<body class="wp">
  <div id="tabs" class="tabs-host"></div>
  <!-- The window as ONLYOFFICE lays it out: ribbon tabs and the document's name, the ribbon,
       a left and a right bar of panels around the rulers and the page, the status bar. -->
  <header class="wp-header" id="header" hidden>
    <nav id="rb-tabs" class="rb-tabs" role="tablist" aria-label="Ribbon"></nav>
    <span class="spacer"></span>
    <span id="title" class="wp-title"></span>
    <span id="state" class="chip" hidden></span>
  </header>
  <div id="toolbar" class="toolbar" hidden></div>
  <div id="conflict" class="conflict" hidden></div>
  <div class="body" id="body">
    <nav id="leftbar" class="wp-sidebar left" aria-label="Panels" hidden></nav>
    <aside id="leftpanel" class="wp-panel left" hidden>
      <nav id="outline" class="outline" aria-label="Headings" hidden></nav>
    </aside>
    <div class="workspace" id="workspace">
      <div class="ruler-corner" id="ruler-corner" hidden></div>
      <canvas id="hruler" class="ruler h" hidden></canvas>
      <canvas id="vruler" class="ruler v" hidden></canvas>
      <main id="scroll" class="scroll">
        <article id="page" class="page" hidden>
          <div id="editor"></div>
        </article>
      </main>
    </div>
    <aside id="rightpanel" class="wp-panel right" hidden></aside>
    <nav id="rightbar" class="wp-sidebar right" aria-label="Settings" hidden></nav>
  </div>
  <footer class="statusbar" id="statusbar" hidden>
    <span id="page-count" class="sb-item"></span>
    <button id="words" class="sb-btn sb-item" type="button" title="Word count"></button>
    <span id="where" class="sb-message"></span>
    <span id="grammar-count" class="sb-item"></span>
    <button id="language" class="sb-btn sb-item" type="button" title="Language for spelling and grammar"></button>
    <span class="sb-group" id="sb-toggles"></span>
    <span class="sb-group" id="sb-view"></span>
    <span class="sb-group sb-zoom" id="sb-zoom"></span>
  </footer>
  <div id="start" hidden></div>
  <div id="backstage" class="backstage" hidden></div>
  <input id="image-input" type="file" accept="image/*" hidden>
  <script type="module" src="writer.js"></script>
</body>
</html>
